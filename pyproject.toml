[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peer-evidence"
version = "1.0.0"
description = "PEER: Personalized Evidence Extraction from Reviews"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1", "pyarrow>=14", "scikit-learn>=1.4", "scipy>=1.11", "tqdm>=4.66", "joblib>=1.3", "rank-bm25>=0.2.2"]

[project.optional-dependencies]
gpu = ["torch>=2.7", "transformers>=4.51", "sentence-transformers>=3.4", "accelerate>=1.3"]
lightgbm = ["lightgbm>=4.3"]
aspects = ["spacy>=3.7"]
independent-check = ["yake>=0.4.8"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["peer*"]
