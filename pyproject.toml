[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peer-evidence"
version = "0.2.0"
description = "PEER: Personalized Evidence Extraction from Reviews"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1", "pyarrow>=14", "scikit-learn>=1.4", "scipy>=1.11", "tqdm>=4.66", "PyYAML>=6", "rank-bm25>=0.2.2", "rouge-score>=0.1.2", "nltk>=3.8"]

[project.optional-dependencies]
gpu = ["torch>=2.7", "transformers>=4.51", "sentence-transformers>=3.4", "accelerate>=1.3"]
lightgbm = ["lightgbm>=4.3"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["peer*"]
