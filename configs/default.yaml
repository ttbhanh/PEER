seed: 42
item_col: parent_asin
user_col: user_id
text_col: text
rating_col: rating
timestamp_col: timestamp

case_building:
  min_user_history: 3
  min_candidate_reviews: 5
  min_candidate_sentences: 20
  max_candidate_sentences: 300
  max_user_history_sentences: 100
  valid_ratio: 0.1
  test_ratio: 0.2
  max_cases_per_dataset: null

embedding:
  model_name: sentence-transformers/all-mpnet-base-v2
  batch_size: 512
  fp16: true
  device: cuda
  fallback_tfidf: true

selection:
  k_list: [1, 3, 5, user_avg]
  lambda_coverage: 0.2
  mu_redundancy: 0.1
  eta_noise: 0.1
